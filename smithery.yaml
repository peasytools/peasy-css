# Smithery configuration for peasy-css
# https://smithery.ai/docs/build/project-config
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties: {}
  commandFunction: |-
    config => ({ command: 'uvx', args: ['--from', 'peasy-css[mcp]', 'python', '-m', 'peasy_css.mcp_server'] })
